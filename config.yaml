# Overrides for the defaults in src/agent/settings.py.
#
# The reasoning behind every value lives in that file, next to the field it
# belongs to, so this stays a short list of what is actually being changed
# rather than a second copy of the rule book that can drift out of step.
#
# Any key here must exist on Settings. An unknown key raises on load instead of
# being ignored, because a typo in a risk limit that silently keeps the default
# is invisible until it costs money.

# ---------------------------------------------------------------------------
# THE UNIVERSE, CHOSEN BY MEASUREMENT
#
# 44 candidate symbols were measured with `run.py spreads` during market hours
# on 31 August 2026, in the 30-45 day window and the 0.55-0.75 delta band. The
# result was not what picking well-known tickers would have produced.
#
# Alpaca's free Basic plan supplies an INDICATIVE options feed rather than full
# OPRA, and its coverage is strikingly uneven. It quotes high-volume ETFs and a
# couple of the largest single names properly, and everything else badly:
#
#     tradable        IWM 1.8%   SPY 2.1%   TLT 2.1%   QQQ 2.3%   GLD 2.3%
#                     DIA 2.5%   IBIT 3.2%  SLV 3.3%   NVDA 4.0%
#     marginal        TSLA 5.5%  SMH 8.3% (best strikes pass)
#     unusable        MSFT 12.5%  AAPL 12.7%  GOOGL 14.3%  JPM 19.1%
#                     WMT 21.8%  UNH 24.2%  UBER 27.2%  DIS 34.1%
#                     XLF 8.5%   XLK 13.8%  XLV 22.8%   EEM 37.5%
#
# MSFT at 12.5% is the tell. It is one of the most liquid option markets in the
# world and genuinely quotes near 1-2%, so that number measures the feed rather
# than the market. Loosening max_spread_pct to admit it would mean sizing
# positions off prices nobody would trade at.
#
# So the universe is what the data supports, and it turned out better than the
# list we set out to build: equities across large and small cap, long treasuries,
# gold, silver and bitcoin. TLT and GLD move on things that have nothing to do
# with what moves SPY -- which is the diversification a basket of nine mega-cap
# technology names never actually had.
# ---------------------------------------------------------------------------

# Two groups, and the difference is worth knowing when reading the journal.
#
# The ETFs and NVDA were chosen by measurement -- their median spread sits at or
# below 4% even on the indicative feed, so their quotes can be taken at face
# value. Measured medians are noted against each.
#
# The single names come from a watchlist proven over a longer run on a separate
# system. Most of them report double-digit spreads on this feed, which is why
# max_spread_pct now sits at 15% (see settings.py for what that gate does and no
# longer does). Their sizing is therefore derived from quotes that are inflated
# by an unknown amount -- an accepted, deliberate limitation, not an oversight.

# ---------------------------------------------------------------------------
# NARROWED TO THE MEASURED-TRADABLE NINE, 1 SEP 2026
#
# The wide names were removed after a day of live evidence, not on a hunch. Line
# up each Monday loss against the spread measured for that symbol:
#
#     GOOGL   spread 14.3%   closed -14.2%
#     MSFT    spread 12.5%   closed -13.9%   (-$905)
#     V       spread 15.3%   closed -20.8%   (-$1,440)
#     NFLX    spread 17.8%   closed -41.9%   (-$1,295)
#     CRWD    spread   --    closed -32.0%   (-$700)
#     IWM     spread  1.8%   ran     -6.5% then recovered to +5.4%
#
# The losses track the spreads, not the market. Roughly half of Monday's
# -$4,340 was the cost of crossing a quote, paid at the ask on a feed that
# quotes those names badly -- and then paid again on the way out. The one
# position on a genuinely tight name is the one that came back.
#
# So the universe is now only what the indicative feed prices properly. Nine
# names, 1.8-4.0% to cross instead of 12-18%. Fewer opportunities, but each one
# is a bet on direction rather than a bet that has to outrun its own entry cost.
#
# Removing a symbol does NOT strand an open position: the exit path iterates the
# broker's positions, not this list, so anything still held is managed to its
# stop or target regardless of whether it may be re-entered.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WIDENED AGAIN, 2 SEP 2026 -- AND A CORRECTION
#
# The narrowing above was decided on ONE measurement. Re-measuring the same
# names two days later during market hours showed spreads move far more than
# that assumed:
#
#     PLTR   11.2% on 31 Aug  ->  3.8% on 2 Sep
#     V      15.3% on 31 Aug  ->  8.6% on 2 Sep
#     JPM    19.1% on 31 Aug  -> 11.2% on 2 Sep
#
# So a wide reading is partly a property of WHEN you looked, not only of the
# name. The narrowing was still the right call for Monday -- those names really
# did cost 12-18% to cross that day, and the losses matched -- but treating one
# snapshot as permanent was wrong.
#
# The gate is what makes widening safe. A name that quotes badly at the moment
# the agent looks is refused at that moment; the only cost of listing it is a
# model call. So the list is now generous and the spread gate does the filtering
# pass by pass, which is what it was always for.
#
# These six add the sectors the ETF-and-metals core had none of: financials,
# healthcare, consumer staples, autos and software.
# ---------------------------------------------------------------------------

symbols:
  # --- Core: measured tradable on both days ----------------------------
  - IWM          # 1.8%
  - SPY          # 2.1%
  - TLT          # 2.1%
  - QQQ          # 2.3%
  - GLD          # 2.3%
  - DIA          # 2.5%
  - IBIT         # 3.2%
  - SLV          # 3.3%
  - NVDA         # 4.0%

  # --- Sector breadth: measured tradable 2 Sep -------------------------
  - PLTR         # 3.8%,  IV/RV 0.84  software
  - F            # 6.3%,  IV/RV 0.97  autos
  - KO           # 8.0%,  IV/RV 0.99  consumer staples
  - V            # 8.6%,  IV/RV 1.04  financials
  - PFE          # 10.6%, IV/RV 1.03  healthcare
  - XLV          # 14.1%, IV/RV 0.83  healthcare sector
  #
  # Deliberately NOT listed, with the reason, so the next reader does not
  # re-add them without re-measuring:
  #   JPM   11.2% wide AND implied at 1.76x realized
  #   MU    $6,977 a contract against a $3,880 per-trade budget
  #   T     17.3% wide     TTWO  19.0% wide

# ---------------------------------------------------------------------------
# ENTRY AGGRESSION: 1.0, RAISED FROM 0.6 BY A LIVE RESULT
#
# 0 = bid, 1 = ask. The original 0.6 was patience: sit inside the spread, let a
# missed entry go, the signal returns in fifteen minutes. That reasoning assumes
# the quote is real.
#
# On 31 Aug 2026 the first live pass placed four orders -- MSFT, TSLA, JPM, CRWV
# -- at limits derived from the indicative feed. Thirty minutes later all four
# were still `status: new`, filled_qty 0. The limits sat below where the market
# actually traded.
#
# Setting this to 1.0 means the limit is placed AT the quoted ask. That is not
# the same as agreeing to pay it: a limit is a ceiling, and a marketable limit
# fills at the best available price, not at the limit. When the quoted ask is
# inflated relative to the real book -- which is what this feed does -- naming it
# is what makes the order marketable at all.
# ---------------------------------------------------------------------------
entry_aggression: 1.0

# ---------------------------------------------------------------------------
# CONCURRENT POSITIONS: 8, RAISED FROM 5
#
# settings.py records that 5 beat 8, 10 and 15 over 2.4 years, winning in both
# split halves independently. That measurement stands -- but it was taken on a
# NINE-name watchlist, and it does not transfer to this one unchanged.
#
# The cap works as a quality filter because candidates are ranked by conviction
# and only the best are taken; raising it reaches further down that ranking. On
# nine names, rank 8 meant very nearly the worst thing on offer. On thirty, the
# eighth-best candidate is a different proposition entirely, and the reasoning
# that justified 5 is measuring a different quantity.
#
# The risk arithmetic is unchanged and bounded: 8 positions at 4% of equity is
# 32% deployed, and a long option cannot lose more than its premium, with each
# one stopped at -25%. Worst case across the whole book is roughly -8% of the
# account, not -32%.
#
# This is a deliberate choice about breadth on a short measurement window, not a
# claim that 8 tested better. It did not; it was not tested here at all.
# ---------------------------------------------------------------------------
max_positions: 8

# ---------------------------------------------------------------------------
# CORRELATION GROUPS
#
# Which names move together. Every other gate reasons about ONE trade: slots
# counted eight, the budget sized each at 4%, and nothing anywhere asked whether
# the eight were secretly the same bet. Eight long calls on mega-cap technology
# is not a diversified book -- it is one macro position with eight chances to be
# wrong at the same time.
#
# Declared rather than computed. A rolling correlation matrix over daily returns
# would be more precise and also unstable, expensive, and impossible to explain
# inside a one-line refusal. "Three tech names is enough tech" is a rule a person
# can check against the open book in two seconds.
# ---------------------------------------------------------------------------
correlation_groups:
  # Broad US equity -- these are close to the same instrument
  SPY: us_equity
  QQQ: us_equity
  DIA: us_equity
  IWM: us_equity
  AIQ: us_equity

  # Mega-cap technology
  AAPL: bigtech
  MSFT: bigtech
  GOOGL: bigtech
  AMZN: bigtech
  META: bigtech
  NFLX: bigtech

  # Semiconductors and AI infrastructure -- one trade wearing many tickers
  NVDA: semis
  AMD: semis
  AVGO: semis
  MU: semis
  SMCI: semis
  CRWV: semis
  ORCL: semis

  # Software
  CRWD: software
  PLTR: software

  # Precious metals
  GLD: metals
  SLV: metals

  # Rates and crypto get their own groups: they are the genuinely
  # uncorrelated part of the book and should never be crowded out
  TLT: rates
  IBIT: crypto

  # Everything else
  JPM: financials
  V: financials
  BAC: financials
  PFE: health
  XLV: health
  F: consumer
  KO: consumer
  INTC: semis
  LLY: health
  WMT: consumer
  COST: consumer
  TSLA: consumer

max_per_group: 2

# ---------------------------------------------------------------------------
# DIRECTIONAL LEAN: TIGHTENED TO 4 FROM 5, 29 OCT 2026
#
# At 5 of 8 slots this cap permitted a book 62% one way, which is close enough
# to no cap at all. Measured over 107 round trips to 22 Oct, the realised mix
# was 64% calls, and the split by side was stark:
#
#       side     n   share   wins        net
#       calls   68     64%    21%    -24,707
#       puts    39     36%    36%     +3,054
#
# Every dollar of the drawdown is in the call side. Two months is one regime --
# a falling one, which is why the puts paid -- so this is NOT a reason to tilt
# bearish, and the number here is a cap on leaning either way.
#
# What it is a reason for: the gate's own argument. Eight positions across
# eight sectors that are all long calls are one bet on the market going up,
# and sector limits cannot see that. 4 of 8 forces the book to be able to be
# wrong about direction without being wrong about everything.
#
# The system prompt has argued the same point at length under "UP AND DOWN ARE
# THE SAME TRADE" since before any of these trades, and the realised 64% says
# argument alone did not achieve it.
# ---------------------------------------------------------------------------
max_same_direction: 4

# ---------------------------------------------------------------------------
# PREMIUM RICHNESS: TIGHTENED TO 1.15 FROM 1.40
#
# The gate is demonstrably working -- on 1 Sep it refused SPY at 2.00x realized,
# JPM at 2.04x and DIA at 1.70x, all in one pass. But 1.40 still admits premium
# priced forty percent above what the underlying actually delivers, and for a
# buyer that is a headwind on every trade regardless of direction.
#
# 1.15 keeps the definition honest: buy when the option is priced at roughly
# what the stock does, or cheaper. The best entry the system has made was PLTR
# at 0.44x -- an option priced for less than half the movement the stock was
# actually delivering -- and that is the shape of trade this number is meant to
# find.
#
# The cost is fewer trades. That is the intended trade-off: this is the one
# input in the whole strategy with a defensible economic basis behind it, and
# being selective about it is worth more than being busy.
# ---------------------------------------------------------------------------
max_iv_to_realized: 1.15

# ---------------------------------------------------------------------------
# TAKE-PROFIT BACKSTOP: 50% OF PREMIUM
#
# Keying exits to the underlying fixed the stop, which used to fire on noise.
# It also, unintentionally, removed any rule that would take a large gain: the
# position now waits for the underlying to reach its target no matter how far
# the option has already run.
#
# On 2 Sep 2026 a PLTR put stood at +50.7% -- $1,105 -- with PLTR at 167.88
# against a target of 159.21, another five percent away. Nothing in the system
# would have sold it, and the scoring window closes the following evening.
#
# So the underlying target still decides when the THESIS is finished, and this
# decides when the POSITION has already paid. Asymmetric on purpose: a premium
# loss can be noise, a premium gain of this size is not.
# ---------------------------------------------------------------------------
premium_target_backstop_pct: 0.50

# ---------------------------------------------------------------------------
# TRAILING STOP: 20% FROM THE PEAK, ARMED AT +10%
#
# The book's losses are not mostly round trips -- 51 of 66 losing trades never
# got 25% ahead at all, and no trailing rule can reach those. This is aimed at
# the rest: WMT once +43%, NVDA +45%, NVDA +44%, SLV +51%, every one of them
# eventually sold at the -25% stop.
#
# Replayed on five-minute marks over all 89 round trips that carry them, with
# each trade's bars clipped to the window between the buy fill and the sell so
# nothing after the real exit can trigger anything:
#
#     rule                  ALL    early     late     beta    first   W cut
#     20% always on      +8,655  +11,002   -2,347   +9,431     -776       6
#     30% always on      +9,749   +4,384   +5,365   +5,631   +4,118       2
#     15%, armed +10%   +15,648  +13,072   +2,576   +7,407   +8,241       7
#     20%, armed +10%   +15,771   +7,895   +7,876   +7,905   +7,866       3
#
# Every always-on setting narrower than about 24% loses money over the second
# half of the history and on the first account; their edge is entirely the
# early beta period. The armed version is the only one flat across all four
# splits, and it survives being triggered off five-minute lows rather than
# closes (+12,699), so it is not an artifact of how the marks were sampled.
#
# It costs three winners -- PLTR 182.5C, IWM 300P, GLD 416P -- all three of
# which it turns into small losses. That is the price, and it is already in the
# +15,771. Twenty of twenty-three winners are untouched.
# ---------------------------------------------------------------------------
trailing_stop_pct: 0.20
trailing_arm_pct: 0.10

# ---------------------------------------------------------------------------
# MINIMUM CONFIDENCE: 0.65, RAISED FROM 0.50
#
# The first thing on this project measured against outcomes rather than
# reasoned about. 81 entries across both accounts, 1 Sep - 2 Oct 2026, each
# paired with the round trip it produced:
#
#     stated confidence   trades   won    net
#     0.55                    11    9%   -7,408
#     0.60                    27   19%  -12,604
#     0.65                    39   33%     -969
#
# Monotonic across three buckets, which is what makes it believable -- any
# single cut on 81 trades would not be. The model's own conviction does carry
# information; the gate was simply set below the level where it starts to mean
# anything.
#
# At 0.50 every one of those low-conviction trades was allowed through, and
# they account for almost the entire loss. Keeping only 0.65 and above would
# have taken 40 of the 81 trades, won 32% instead of 23%, and finished at
# -1,669 instead of -24,638.
#
# Two things this is NOT:
#
#   * It is not profitable. 32% still sits under the ~36% this payoff needs to
#     break even. It stops most of the bleeding; it does not fix the entries.
#   * It is not out-of-sample. The threshold was chosen after seeing these
#     outcomes. The monotonicity is the evidence, not the -1,669.
#
# The model almost never exceeds 0.65 -- the highest seen in 4,356 opinions was
# 0.70 -- so this keeps roughly half of all entries and will reduce trade count
# noticeably. If the distribution shifts and entries stop entirely, that is the
# first thing to check rather than a market that went quiet.
# ---------------------------------------------------------------------------
min_confidence: 0.60

# ---------------------------------------------------------------------------
# RECALIBRATED TO 0.60 FOR SONNET, 21 OCT 2026
#
# A confidence threshold belongs to the model that produced the numbers. 0.65
# was derived from DeepSeek-R1, whose opinions spanned 0.50 to 0.70 and clustered
# on 0.65 -- there, it was the top band. Carrying it across to Sonnet silently
# stopped the agent: of 1,723 opinions between 15 and 21 Oct, exactly THREE
# reached 0.65. The last entry on either account was 13 Oct, and both books ran
# down to cash while nothing new could pass.
#
# Sonnet's distribution, same window:
#
#     min 0.00   median 0.58   max 0.68
#
#     >= 0.55    75% of all opinions pass
#     >= 0.58    53%
#     >= 0.60    31%        <- here
#     >= 0.62    15%
#     >= 0.65     0.2%
#
# Roughly a quarter of opinions sit below 0.50; those are the model declining
# outright, so among views that actually name a direction 0.60 keeps about 41%.
# Under DeepSeek, 0.65 kept 40 of 81 entries -- about half. 0.60 is the nearest
# match on selectivity, and sits above the median, so it is genuinely choosing
# rather than waving things through.
#
# The wider spread is the prompt rewrite working: it asked for the range to be
# used, and DeepSeek never once went below 0.50 while Sonnet reaches 0.00.
#
# What this number is NOT is validated. The 0.65 figure had outcome data behind
# it -- win rates by bucket across 81 closed trades. This one has none, because
# Sonnet has not completed a single trade. It is a calibration to a distribution,
# not to results. Re-derive it from outcomes once ~20 trades have closed.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# SETUP QUALITY: RECORDED FROM 29 OCT 2026, NOT YET GATING
#
# Why a second number exists at all. The prompt used to ask confidence to do
# two incompatible jobs: be the probability the model would defend, and also
# spread itself across the range so the agent could sort on it. Those conflict.
# The honest probability of a correct four-week direction call on a liquid
# large cap really is a modest lean, so a calibrated model clusters -- and
# Sonnet does, with 94% of its directional opinions inside 0.55-0.64 and both
# of its winners sitting at exactly the 0.60 floor. There was nothing left to
# select on, and no threshold could have recovered it.
#
# So confidence is now asked for as a probability and nothing else, and the
# relative judgement moved to its own field: 0-10, explicitly a RANK against
# the typical symbol the model is shown. A rank spreads naturally, because it
# is a comparison rather than an absolute, and nothing is distorted by using
# the whole of it.
#
# 0 means this gate never refuses, which is deliberate. The number is being
# recorded on every opinion and every entry and it decides nothing yet, for
# the same reason the 0.60 floor should not have been trusted on arrival:
# there is no outcome data behind it. Raise it once ~20 trades have closed
# with a quality recorded, and raise it to whatever those outcomes say rather
# than to whatever looks reasonable.
#
# Note the failure direction. A backend that does not return the field at all
# yields 0, which passes while this is 0 and blocks the moment it is raised --
# missing data blocking rather than permitting, as everywhere else here.
# ---------------------------------------------------------------------------
min_setup_quality: 0

# ---------------------------------------------------------------------------
# SIZE PER TRADE: 8% OF EQUITY, DOUBLED FROM 4%
#
# At 4% and roughly $86,000 of equity, a trade got about $3,400 -- which on a
# $16 contract like GLD or NVDA buys two of them. Positions that small make the
# account's outcome depend on rounding: one contract either way is a third of
# the position.
#
# At 8% the same trade gets about $6,900, so an expensive contract is four or
# five rather than two, and a cheap one is sized by the budget instead of by
# how few contracts the budget happened to afford.
#
# WHAT THIS COSTS, STATED PLAINLY
#
# Size multiplies whatever the expectancy already is. It does not improve it.
# Two measurements say that is a real cost here:
#
#   * The 2.4-year backtest recorded in settings.py went the other way when
#     size rose from 2% to 4% -- profit factor fell from 1.11 to 1.02 and the
#     worst drawdown rose from about $17k to about $44k.
#   * Live expectancy across 90 closed trades on both accounts is about
#     -0.35R per trade. Doubling size doubles the rate of that loss.
#
# The case for doing it anyway is that the system has changed underneath those
# numbers -- the stop floor, the five-minute exits, the confidence gate and the
# cooldown all post-date most of those trades -- and that an account deploying
# a third of its cash cannot express a result either way. This is a deliberate
# choice to find out faster, taken with the arithmetic above understood.
#
# Eight positions at 8% is 64% of equity deployed, so a third stays in cash and
# the buying-power gate still shrinks anything that does not fit.
# ---------------------------------------------------------------------------
risk_per_trade: 0.08

# Raised with the budget above. At 8% of equity a cheap contract -- F around
# $1.07 -- would want roughly 64 of them, so the old cap of 50 would have
# quietly trimmed the position and made the budget mean something different for
# cheap options than for expensive ones.
max_contracts: 150
